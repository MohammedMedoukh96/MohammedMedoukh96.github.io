<style>
  /* MM4GAMES brand kit: sky radial gradient, navy ink, play coral, coin yellow. Luckiest Guy (Latin titles), Baloo Bhaijaan 2 (Arabic titles). */
  @font-face { font-family: "LuckiestGuy"; src: url("assets/fonts/luckiest-guy.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "BalooAr"; src: url("assets/fonts/baloo-ar.woff2") format("woff2"); font-weight: 800; font-display: swap;
    unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
  @font-face { font-family: "BalooAr"; src: url("assets/fonts/baloo-latin.woff2") format("woff2"); font-weight: 800; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    --sky: #2EA7FF; --sky-light: #6FD0FF; --sky-deep: #1479D6;
    --navy: #1A1D45; --coral: #FF5A5F; --coral-deep: #DE3E4C; --yellow: #FFC93C; --cyan: #5CE6FF; --white: #FFFFFF;
    --ink-soft: #464B78; --card: #FFFFFF;
    --title: "LuckiestGuy", "BalooAr", system-ui, sans-serif;
    --ar-title: "BalooAr", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, Arial, sans-serif;
    /* dark outline around white text on the sky (8 directions + a small drop), so it reads on every shade of blue */
    --outline: -2px -2px 0 var(--navy), 0 -2px 0 var(--navy), 2px -2px 0 var(--navy), 2px 0 0 var(--navy),
               2px 2px 0 var(--navy), 0 2px 0 var(--navy), -2px 2px 0 var(--navy), -2px 0 0 var(--navy), 0 3.5px 0 var(--navy);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; color: var(--navy); font-family: var(--body); background-color: var(--sky); }
  /* the sky stays put while the page scrolls (a fixed layer also works on iPhone, unlike background-attachment: fixed) */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background: radial-gradient(ellipse 130% 85% at 50% 28%, var(--sky-light) 0%, var(--sky) 48%, var(--sky-deep) 100%);
  }
  /* soft clouds along the bottom of the screen */
  body::after {
    content: ""; position: fixed; left: -10%; right: -10%; bottom: -60px; height: 220px; z-index: -1; pointer-events: none;
    background:
      radial-gradient(closest-side, rgba(255,255,255,0.55), rgba(255,255,255,0) 100%) 0% 100% / 46% 100% no-repeat,
      radial-gradient(closest-side, rgba(255,255,255,0.5), rgba(255,255,255,0) 100%) 50% 100% / 52% 120% no-repeat,
      radial-gradient(closest-side, rgba(255,255,255,0.55), rgba(255,255,255,0) 100%) 100% 100% / 46% 100% no-repeat;
  }
  a { color: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px 16px calc(30px + env(safe-area-inset-bottom)); }

  /* header */
  .top { position: relative; text-align: center; padding-top: 34px; }
  .lang {
    position: absolute; top: 4px; inset-inline-end: 0; cursor: pointer;
    background: rgba(26, 29, 69, 0.88); color: var(--white); border: 3px solid var(--white); border-radius: 999px;
    padding: 5px 14px 6px; font: 800 15px/1.2 var(--ar-title); box-shadow: 0 4px 0 rgba(26, 29, 69, 0.35);
  }
  .lang[lang="en"] { font-family: var(--title); font-weight: 400; letter-spacing: 1px; padding-top: 7px; }
  .logo { display: block; width: min(80%, 340px); height: auto; margin: 6px auto 8px; filter: drop-shadow(0 8px 14px rgba(10, 14, 48, 0.25)); }
  .tagline { margin: 0; color: var(--white); font-weight: 800; font-size: 17px; letter-spacing: 0.2px; text-shadow: var(--outline); }
  .spark { position: absolute; width: 8px; height: 8px; background: var(--white); opacity: 0.9;
    box-shadow: 8px 0 0 var(--white), -8px 0 0 var(--white), 0 8px 0 var(--white), 0 -8px 0 var(--white); }
  .spark.y { background: var(--yellow); box-shadow: 8px 0 0 var(--yellow), -8px 0 0 var(--yellow), 0 8px 0 var(--yellow), 0 -8px 0 var(--yellow); }
  .spark.c { background: var(--cyan); box-shadow: 8px 0 0 var(--cyan), -8px 0 0 var(--cyan), 0 8px 0 var(--cyan), 0 -8px 0 var(--cyan); }

  /* section titles: white letters, navy outline + extrusion (logo look) */
  .section {
    margin: 28px 0 14px; text-align: center; color: var(--white); font-family: var(--title); font-weight: 400;
    font-size: 28px; letter-spacing: 1px; line-height: 1.1;
    -webkit-text-stroke: 6px var(--navy); paint-order: stroke fill; text-shadow: 0 4px 0 var(--navy);
  }
  html[dir="rtl"] .section { font-family: var(--ar-title); font-weight: 800; font-size: 30px; letter-spacing: 0; }

  /* game cards */
  .games { display: grid; gap: 22px; }
  .card {
    position: relative; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start;
    background: var(--card); border: 4px solid var(--navy); border-radius: 26px; padding: 16px;
    box-shadow: 0 7px 0 var(--navy), 0 16px 28px rgba(10, 14, 48, 0.22);
  }
  .card.featured { grid-template-columns: 1fr; text-align: center; padding: 22px 18px 20px; }
  .icon, .icon-tile {
    width: 84px; height: 84px; border-radius: 22%; border: 3px solid var(--navy); box-shadow: 0 4px 0 var(--navy);
    object-fit: cover; background: #EEF4FF; display: block;
  }
  .icon-tile { display: flex; align-items: center; justify-content: center; font: 400 30px/1 var(--title); color: var(--white);
    background: linear-gradient(160deg, var(--coral), var(--coral-deep)); }
  .featured .icon, .featured .icon-tile { width: 124px; height: 124px; margin: 4px auto 0; }
  .name { margin: 2px 0 4px; font: 400 24px/1.05 var(--title); letter-spacing: 0.5px; color: var(--navy); }
  .name:lang(ar) { font: 800 27px/1.2 var(--ar-title); letter-spacing: 0; }
  .featured .name { font-size: 32px; margin-top: 10px; }
  .featured .name:lang(ar) { font-size: 34px; }
  .tag { margin: 0 0 6px; font-size: 15px; line-height: 1.45; color: var(--ink-soft); }
  .featured .tag { font-size: 16px; }
  .note { margin: 0 0 12px; font-size: 14px; line-height: 1.45; font-weight: 800; color: var(--coral-deep); }
  .label {
    position: absolute; top: -16px; inset-inline-end: 18px; transform: rotate(3deg);
    background: var(--coral); color: var(--white); border: 3px solid var(--white); border-radius: 999px; padding: 6px 14px 5px;
    box-shadow: 0 4px 0 var(--coral-deep), 0 8px 14px rgba(10, 14, 48, 0.2); font: 400 15px/1.1 var(--title); letter-spacing: 1px;
  }
  .label:lang(ar) { font: 800 16px/1.2 var(--ar-title); letter-spacing: 0; transform: rotate(-3deg); padding: 4px 14px 6px; }
  .badges { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2px; }
  .featured .badges { justify-content: center; }
  .badges a { display: block; border-radius: 10px; transition: transform 0.15s ease; }
  .badges a:hover { transform: translateY(-2px); }
  .badges a:focus-visible, .soc:focus-visible, .lang:focus-visible, footer a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .badges img { display: block; height: 42px; width: auto; }
  .featured .badges img { height: 46px; }
  .soon { display: inline-block; margin-top: 6px; padding: 6px 12px; border-radius: 999px; background: var(--navy); color: var(--white); font-weight: 800; font-size: 14px; }

  /* in-app browser hint (iOS Instagram / TikTok / Facebook can block App Store links) */
  .hint { display: none; margin: 18px 0 0; padding: 10px 14px; border-radius: 16px; background: rgba(26, 29, 69, 0.9); color: var(--white);
    font-size: 14px; line-height: 1.45; text-align: center; border: 2px solid rgba(255, 255, 255, 0.7); }
  .hint.show { display: block; }

  /* social */
  .social { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .soc {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 8px 6px; text-decoration: none;
    background: var(--navy); color: var(--white); border: 3px solid var(--white); border-radius: 16px;
    box-shadow: 0 5px 0 rgba(26, 29, 69, 0.45); font-weight: 800; font-size: 14px; direction: ltr;
  }
  .soc svg { width: 22px; height: 22px; flex: none; }

  /* footer */
  footer { margin-top: 30px; text-align: center; color: var(--white); font-size: 15px; font-weight: 800; line-height: 1.75; letter-spacing: 0.2px; text-shadow: var(--outline); }
  footer .bit { display: block; width: 92px; height: auto; margin: 0 auto 8px; filter: drop-shadow(0 6px 10px rgba(10, 14, 48, 0.25)); }
  footer p { margin: 4px 0; }
  footer a { font-weight: 800; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .mail { direction: ltr; unicode-bidi: isolate; }
  .small { font-size: 13.5px; }
  @media (max-width: 360px) { .social { grid-template-columns: repeat(2, 1fr); } .badges img, .featured .badges img { height: 38px; } }
  @media (prefers-reduced-motion: reduce) { .badges a { transition: none; } }
</style>

<script>
/* =====================================================================
   HOW TO ADD A NEW GAME
   1) Put its icon (square PNG or WebP, 256–512 px) in assets/games/ — e.g. assets/games/my-game.webp
   2) Copy one { ... } block below, paste it at the TOP of the list (the first game is shown big)
      and change the texts, the App Store id (the number after "id" in its App Store link)
      and the Google Play package (the text after "id=" in its Google Play link).
   3) No store link yet? Leave ios / android empty ("") and it shows "Coming soon".
   ===================================================================== */
const GAMES = [
  {
    id: 'square-eggs',
    icon: 'assets/games/square-eggs.webp',
    name:  { en: 'Square Eggs', ar: 'البيض المربع' },
    // launch day: { en: 'NEW 2.0', ar: 'جديد 2.0' }
    label: { en: '2.0 coming soon', ar: 'الإصدار 2.0 قريبًا' },
    tag:   { en: 'Tap to lay square eggs and stack your way up!', ar: 'المس الشاشة لتضع بيضًا مربعًا وكدّسه لتصعد!' },
    // launch day: { en: '100 levels, 5 worlds, King Crab boss fights and 14 chick skins.', ar: '100 مرحلة في 5 عوالم، وقتال مع الملك سلطعون، و14 مظهرًا للكتكوت.' }
    note:  { en: 'The 2.0 update is on the way: 100 levels in 5 worlds.', ar: 'تحديث 2.0 في الطريق: 100 مرحلة في 5 عوالم.' },
    ios: '6741331299',
    android: 'com.MM4Games.squareEggs',
  },
  {
    id: 'scraper-cars-tower',
    // replace with a local file (assets/games/scraper-cars-tower.webp) when you have it
    icon: 'https://play-lh.googleusercontent.com/CJN66tSjmGc-40pAR0-LWke8Ol013ynD2A45_fGGRHLiYojDStDexu0eEAAsZR7ZuFZS94vmgGPeyzs3Lfe9oA=s256',
    name: { en: 'Scraper Cars Tower', ar: 'Scraper Cars Tower' },
    tag:  { en: 'Build the tallest tower of cars, one well-timed tap at a time!', ar: 'ابنِ أعلى برج من السيارات بلمسة في الوقت المناسب!' },
    ios: '6743801776',
    android: 'com.MM4Games.ScraperCarsTower',
  },
  {
    id: 'meros-bunny',
    // replace with a local file (assets/games/meros-bunny.webp) when you have it
    icon: 'https://play-lh.googleusercontent.com/ZNABZ4YoOEygNr6MA0rh4vpjjQeuDHXNGSr1w1qBINcxHAODewbI1BW-ZGclKa6w6dP_xa1Ea4iRzsi36fcONQ=s256',
    name: { en: "Mero's Bunny", ar: "Mero's Bunny" },
    tag:  { en: 'Catch the good fruit, dodge the rotten ones and beat your best score!', ar: 'اجمع الفاكهة الطازجة وتجنّب الفاسدة وحطّم أفضل نتيجة لك!' },
    ios: '6740981117',
    android: 'com.MM4Games.merosbunny',
  },
];

/* ---------------------------------------------------------------- nothing below needs editing */
const params = new URLSearchParams(location.search);
const ua = navigator.userAgent || '';
// Where did the visitor come from? The bio links stay clean (…/MM4Games), so the app's own browser or the referrer tells us.
function detectSrc() {
  const p = (params.get('src') || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 30);
  if (p) return p;
  if (/Barcelona|Threads/i.test(ua)) return 'threads';
  if (/Instagram/i.test(ua)) return 'instagram';
  if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) return 'facebook';
  if (/musical_ly|TikTok|Bytedance|trill/i.test(ua)) return 'tiktok';
  if (/Twitter/i.test(ua)) return 'x';
  const r = document.referrer || '';
  if (/youtube\.com|youtu\.be/i.test(r)) return 'youtube';
  if (/threads\.(net|com)/i.test(r)) return 'threads';
  if (/instagram\.com/i.test(r)) return 'instagram';
  if (/facebook\.com|fb\.com|fb\.me/i.test(r)) return 'facebook';
  if (/tiktok\.com/i.test(r)) return 'tiktok';
  if (/(^|\/\/)(t\.co|x\.com|twitter\.com)/i.test(r)) return 'x';
  return 'site';
}
const SRC = detectSrc();
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(ua);
const inApp = /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Bytedance|Twitter|Threads|Barcelona/i.test(ua);

const appStoreUrl = (id) => 'https://apps.apple.com/app/id' + id + '?ct=' + encodeURIComponent(SRC);
const playUrl = (pkg) => 'https://play.google.com/store/apps/details?id=' + encodeURIComponent(pkg) +
  '&referrer=' + encodeURIComponent('utm_source=' + SRC + '&utm_medium=links_page&utm_campaign=mm4games');

const T = { soon: { en: 'Coming soon', ar: 'قريبًا' }, appStore: { en: 'Download on the App Store', ar: 'حمّلها من آب ستور' }, play: { en: 'Get it on Google Play', ar: 'احصل عليها من جوجل بلاي' } };

let lang = 'en';
try { lang = localStorage.getItem('mm4-lang') || ''; } catch (e) { lang = ''; }
if (params.get('lang') === 'ar' || params.get('lang') === 'en') lang = params.get('lang');
if (lang !== 'ar' && lang !== 'en') lang = (navigator.languages || [navigator.language || 'en']).some((l) => /^ar/i.test(l)) ? 'ar' : 'en';

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function badge(href, img, alt, w, h) {
  const a = el('a'); a.href = href; a.setAttribute('aria-label', alt);
  const i = el('img'); i.src = img; i.alt = alt; i.width = w; i.height = h; i.loading = 'lazy';
  a.appendChild(i); return a;
}

function iconFor(g) {
  const img = el('img', 'icon'); img.src = g.icon; img.alt = ''; img.width = 256; img.height = 256; img.loading = 'lazy';
  img.addEventListener('error', () => {                     // icon missing? show a coloured tile with the initials
    const t = el('div', 'icon-tile', g.name.en.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase());
    t.setAttribute('aria-hidden', 'true'); img.replaceWith(t);
  }, { once: true });
  return img;
}

function render() {
  const box = document.getElementById('games');
  box.textContent = '';
  GAMES.forEach((g, i) => {
    const card = el('article', 'card' + (i === 0 ? ' featured' : ''));
    if (g.label) { const l = el('span', 'label', g.label[lang]); l.lang = lang; card.appendChild(l); }
    card.appendChild(iconFor(g));
    const body = el('div', 'body');
    const nameText = g.name[lang] || g.name.en;
    const n = el('h3', 'name', nameText); n.lang = /[؀-ۿ]/.test(nameText) ? 'ar' : 'en';
    body.appendChild(n);
    if (g.tag) body.appendChild(el('p', 'tag', g.tag[lang]));
    if (g.note) body.appendChild(el('p', 'note', g.note[lang]));
    const b = el('div', 'badges');
    const links = [];
    if (g.ios) links.push({ os: 'ios', node: badge(appStoreUrl(g.ios), 'assets/img/app-store-badge.svg', T.appStore[lang] + ' – ' + g.name.en, 120, 40) });
    if (g.android) links.push({ os: 'android', node: badge(playUrl(g.android), 'assets/img/google-play-badge.png', T.play[lang] + ' – ' + g.name.en, 135, 40) });
    if (isAndroid) links.sort((a, b) => (a.os === 'android' ? -1 : 0) - (b.os === 'android' ? -1 : 0));   // the visitor's own store first
    links.forEach((x) => b.appendChild(x.node));
    if (!links.length) b.appendChild(el('span', 'soon', T.soon[lang]));
    card.appendChild(body);
    card.appendChild(b);                                   // badges span the whole card width
    box.appendChild(card);
  });
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-en]').forEach((e) => { e.textContent = e.dataset[lang]; });
  const btn = document.getElementById('langBtn');
  btn.textContent = lang === 'ar' ? 'English' : 'عربي';
  btn.lang = lang === 'ar' ? 'en' : 'ar';
  btn.setAttribute('aria-label', lang === 'ar' ? 'Switch to English' : 'التبديل إلى العربية');
  render();
}

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('mm4-lang', lang); } catch (e) { /* private mode: language just isn't remembered */ }
  applyLang();
});
if (isIOS && inApp) document.getElementById('hint').classList.add('show');
applyLang();
</script>
</body>
</html>
